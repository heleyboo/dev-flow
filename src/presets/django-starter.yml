name: "django-starter"
description: "Django backend starter with PostgreSQL and Redis"
services:
  api:
    role: "backend"
    stack: "django"
    language: { name: "python", version: "3.12" }
    framework_version: "5.0"
    port: 8000
    scaffold:
      command: "django-admin startproject {name} {path}"
      docker_image: "python:3.12-slim"
infrastructure:
  database: { engine: "postgresql", version: "16", port: 5432 }
  cache: { engine: "redis", version: "7", port: 6379 }
  queue: { engine: null }
  search: { engine: null }
  storage: { engine: null }
