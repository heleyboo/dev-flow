name: "dotnet-starter"
description: ".NET backend starter with PostgreSQL and Redis"
services:
  api:
    role: "backend"
    stack: "dotnet"
    language: { name: "csharp", version: "8.0" }
    framework_version: "8.0"
    port: 8000
    scaffold:
      command: "dotnet new webapi -o {path}"
      docker_image: "mcr.microsoft.com/dotnet/sdk:8.0"
infrastructure:
  database: { engine: "postgresql", version: "16", port: 5432 }
  cache: { engine: "redis", version: "7", port: 6379 }
  queue: { engine: null }
  search: { engine: null }
  storage: { engine: null }
