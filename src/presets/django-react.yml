name: "django-react"
description: "Django backend + React frontend fullstack with PostgreSQL and Redis"
services:
  api:
    role: "backend"
    stack: "django"
    language: { name: "python", version: "3.12" }
    framework_version: "5.0"
    port: 8000
    scaffold:
      command: "django-admin startproject {name} {path}"
      docker_image: "python:3.12-slim"
  web:
    role: "frontend"
    stack: "react"
    language: { name: "typescript", version: "5.5" }
    port: 3000
    scaffold:
      command: "npx create-vite {path} --template react-ts"
      docker_image: "node:20-alpine"
infrastructure:
  database: { engine: "postgresql", version: "16", port: 5432 }
  cache: { engine: "redis", version: "7", port: 6379 }
  queue: { engine: null }
  search: { engine: null }
  storage: { engine: null }
