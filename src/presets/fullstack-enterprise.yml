name: "fullstack-enterprise"
description: "Laravel + React fullstack enterprise with PostgreSQL, Redis, RabbitMQ, Elasticsearch, and MinIO"
services:
  api:
    role: "backend"
    stack: "laravel"
    language: { name: "php", version: "8.3" }
    framework_version: "11"
    port: 8000
    scaffold:
      command: "composer create-project laravel/laravel {path}"
      docker_image: "composer:latest"
  web:
    role: "frontend"
    stack: "react"
    language: { name: "typescript", version: "5.5" }
    port: 3000
    scaffold:
      command: "npx create-vite {path} --template react-ts"
      docker_image: "node:20-alpine"
infrastructure:
  database: { engine: "postgresql", version: "16", port: 5432 }
  cache: { engine: "redis", version: "7", port: 6379 }
  queue: { engine: "rabbitmq", version: "3", port: 5672, management_port: 15672 }
  search: { engine: "elasticsearch", version: "8.12.0", port: 9200 }
  storage: { engine: "minio", version: "latest", port: 9000 }
