name: "microservice-base"
description: "FastAPI microservice base with RabbitMQ, PostgreSQL, Redis, and MinIO"
services:
  api:
    role: "backend"
    stack: "fastapi"
    language: { name: "python", version: "3.12" }
    framework_version: "0.115"
    port: 8000
    scaffold:
      command: "pip install fastapi uvicorn"
      docker_image: "python:3.12-slim"
infrastructure:
  database: { engine: "postgresql", version: "16", port: 5432 }
  cache: { engine: "redis", version: "7", port: 6379 }
  queue: { engine: "rabbitmq", version: "3", port: 5672, management_port: 15672 }
  search: { engine: null }
  storage: { engine: "minio", version: "latest", port: 9000 }
